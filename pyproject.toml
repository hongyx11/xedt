[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xedt"
version = "0.1.2"
description = "Accelerator Editor: CUDA/C++ editor setup for macOS"
readme = "README.md"
requires-python = ">=3.9"
authors = [{name = "xedt contributors"}]
classifiers = [
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Code Generators",
]

[project.scripts]
xedt = "xedt.cli:main"

[tool.setuptools.package-data]
xedt = ["assets/*.json", "assets/*.lua"]
